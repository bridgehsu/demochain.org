    # ================================
    # demochain.org - 静态网站
    # ================================

    # HTTP 重定向到 HTTPS
    server {
        listen 80;
        server_name demochain.org www.demochain.org;
        return 301 https://$host$request_uri;
    }

    # HTTPS 静态文件服务
    server {
        listen 443 ssl;
        server_name demochain.org www.demochain.org;

        # SSL 配置
        ssl_certificate     /usr/local/web/cert/demochain.org.pem;
        ssl_certificate_key /usr/local/web/cert/demochain.org.key;
        ssl_session_timeout 5m;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        charset utf-8;

        # 安全头配置
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net cdnjs.cloudflare.com static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';" always;

        location / {
          root /usr/local/web/demochain.org/dist;
          index index.html index.htm;
          try_files $uri $uri/ /index.html;
       }
    }