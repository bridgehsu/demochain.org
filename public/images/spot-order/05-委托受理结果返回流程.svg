<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:729px;height:622px;background:#FFFFFF;" width="729px" height="622px" viewBox="0 0 729 622" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="277.158" y="32.995" fill="#000" font-size="14" textLength="173.482" font-weight="700">05｜委托受理结果返回流程</text></g><ellipse cx="319.001" cy="62.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="249.001" y="92.297" width="140.001" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="259.001" y="113.436" fill="#0F172A" font-size="12" textLength="120.001">委托处理分支返回结果</text><rect x="259.694" y="146.266" width="118.614" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="269.694" y="167.404" fill="#0F172A" font-size="12" textLength="98.614">委托 API 组装响应</text><polygon points="258.502,200.234,379.501,200.234,391.501,212.234,379.501,224.234,258.502,224.234,246.502,212.234,258.502,200.234" fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="258.502" y="216.042" fill="#0F172A" font-size="11" textLength="120.999">是否得到有效委托结果？</text><text x="235.502" y="209.64" fill="#000" font-size="11">是</text><text x="391.501" y="209.64" fill="#000" font-size="11">否</text><rect x="160.501" y="234.234" width="152.001" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="170.501" y="255.373" fill="#0F172A" font-size="12" textLength="132.001">返回委托标识与受理状态</text><rect x="337.501" y="234.234" width="128.001" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="347.501" y="255.373" fill="#0F172A" font-size="12" textLength="108.001">形成失败或异常结果</text><polygon points="319.001,274.203,331.001,286.203,319.001,298.203,307.001,286.203,319.001,274.203" fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="237.953" y="318.203" width="162.096" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="247.953" y="339.342" fill="#0F172A" font-size="12" textLength="142.096">coinex-app 接收接口响应</text><rect x="243.001" y="372.172" width="152.001" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="253.001" y="393.311" fill="#0F172A" font-size="12" textLength="132.001">向交易终端返回下单结果</text><path d="M380.501,416.141 L380.501,456.406 L708.798,456.406 L708.798,426.141 L698.798,416.141 L380.501,416.141" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M698.798,416.141 L698.798,426.141 L708.798,426.141 L698.798,416.141" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="386.501" y="433.208" fill="#000" font-size="13" textLength="307.297">源码注意：V1 创建服务捕获异常后可能返回空结果，</text><text x="386.501" y="448.34" fill="#000" font-size="13" textLength="232.699">API 响应包装语义需结合实际版本验证。</text><polygon points="269.502,456.406,368.501,456.406,380.501,468.406,368.501,480.406,269.502,480.406,257.502,468.406,269.502,456.406" fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="269.502" y="472.214" fill="#0F172A" font-size="11" textLength="98.999">终端显示受理成功？</text><text x="246.502" y="465.812" fill="#000" font-size="11">是</text><text x="380.501" y="465.812" fill="#000" font-size="11">否</text><path d="M224.001,490.406 L224.001,506.539 L204.001,510.539 L224.001,514.539 L224.001,530.672 A0,0 0 0 0 224.001,530.672 L414.001,530.672 A0,0 0 0 0 414.001,530.672 L414.001,500.406 L404.001,490.406 L224.001,490.406 A0,0 0 0 0 224.001,490.406" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M404.001,490.406 L404.001,500.406 L414.001,500.406 L404.001,490.406" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="230.001" y="507.473" fill="#000" font-size="13" textLength="156">受理成功只说明请求处理到</text><text x="230.001" y="522.606" fill="#000" font-size="13" textLength="169">当前受理阶段，不等于成交。</text><rect x="16" y="493.555" width="188.001" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="514.693" fill="#0F172A" font-size="12" textLength="168.001">用户可凭委托标识查询后续状态</text><rect x="434.001" y="490.406" width="188.001" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="444.001" y="511.545" fill="#0F172A" font-size="12" textLength="168.001">展示失败原因并按请求标识核查</text><polygon points="319.001,536.672,331.001,548.672,319.001,560.672,307.001,548.672,319.001,536.672" fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="319.001" cy="591.672" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="319.001" cy="591.672" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="319.001" y1="72.297" x2="319.001" y2="92.297" style="stroke:#475569;stroke-width:1;"/><polygon points="315.001,82.297,319.001,92.297,323.001,82.297,319.001,86.297" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="319.001" y1="126.266" x2="319.001" y2="146.266" style="stroke:#475569;stroke-width:1;"/><polygon points="315.001,136.266,319.001,146.266,323.001,136.266,319.001,140.266" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.502" y1="212.234" x2="236.502" y2="212.234" style="stroke:#475569;stroke-width:1;"/><line x1="236.502" y1="212.234" x2="236.502" y2="234.234" style="stroke:#475569;stroke-width:1;"/><polygon points="232.502,224.234,236.502,234.234,240.502,22