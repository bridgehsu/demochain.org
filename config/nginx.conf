# demochain.org 站点 Nginx 配置（主机侧，无后端）
# 部署：
#   sudo cp config/nginx.conf /etc/nginx/sites-available/demochain.org.conf
#   sudo ln -sf /etc/nginx/sites-available/demochain.org.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 对应 Docker：
#   demochain-org -> 127.0.0.1:4080
#
# 启动容器示例：
#   cd docker && HOST_PORT=4080 docker compose up -d --build

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name demochain.org www.demochain.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demochain.org www.demochain.org;

    ssl_certificate     /etc/ssl/demochain/demochain.org.pem;
    ssl_certificate_key /etc/ssl/demochain/demochain.org.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # 前端静态站（Docker serve → 4080）
    location / {
        proxy_pass http://127.0.0.1:4080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
