<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:704px;height:555px;background:#FFFFFF;" width="704px" height="555px" viewBox="0 0 704 555" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="278.26" y="32.995" fill="#000" font-size="14" textLength="145.482" font-weight="700">11｜订单状态查询流程</text></g><ellipse cx="306.002" cy="62.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="206.001" y="92.297" width="200.001" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="216.001" y="113.436" fill="#0F172A" font-size="12" textLength="180.001">用户输入订单标识或选择查询条件</text><polygon points="70.501,146.266,125.5,146.266,137.5,158.266,125.5,170.266,70.501,170.266,58.501,158.266,70.501,146.266" fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="102.001" y="180.476" fill="#000" font-size="11" textLength="44">当前委托</text><text x="70.501" y="162.074" fill="#0F172A" font-size="11" textLength="55">查询内容？</text><rect x="16" y="203.07" width="164.001" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="224.209" fill="#0F172A" font-size="12" textLength="144.001">查询未完成或部分成交委托</text><polygon points="272.002,146.266,316.002,146.266,328.002,158.266,316.002,170.266,272.002,170.266,260.002,158.266,272.002,146.266" fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="272.002" y="162.074" fill="#0F172A" font-size="11" textLength="44">历史委托</text><text x="328.002" y="155.671" fill="#000" font-size="11" textLength="44">成交明细</text><rect x="200.001" y="190.266" width="188.001" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="210.001" y="211.404" fill="#0F172A" font-size="12" textLength="168.001">查询已完成、已撤销或失败委托</text><rect x="408.002" y="199.668" width="188.001" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="418.002" y="220.807" fill="#0F172A" font-size="12" textLength="168.001">按订单或时间范围查询成交记录</text><rect x="236.001" y="277.039" width="140.001" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="246.001" y="298.178" fill="#0F172A" font-size="12" textLength="120.001">查询对应业务数据视图</text><polygon points="278.502,331.008,333.502,331.008,345.502,343.008,333.502,355.008,278.502,355.008,266.502,343.008,278.502,331.008" fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="278.502" y="346.816" fill="#0F172A" font-size="11" textLength="55">找到记录？</text><text x="255.502" y="340.414" fill="#000" font-size="11">是</text><text x="345.502" y="340.414" fill="#000" font-size="11">否</text><rect x="108.001" y="365.008" width="188.001" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="118.001" y="386.146" fill="#0F172A" font-size="12" textLength="168.001">返回订单状态、数量与成交信息</text><rect x="316.002" y="365.008" width="188.001" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="326.002" y="386.146" fill="#0F172A" font-size="12" textLength="168.001">返回空结果并提示核对查询条件</text><polygon points="306.002,404.977,318.002,416.977,306.002,428.977,294.002,416.977,306.002,404.977" fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="194.001" y="448.977" width="224.002" height="33.969" fill="#F8FAFC" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="204.001" y="470.115" fill="#0F172A" font-size="12" textLength="204.002">必要时按订单标识对照撮合与账户记录</text><path