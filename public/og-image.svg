<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#0f1115"/>

  <!-- 背景装饰光晕 -->
  <ellipse cx="300" cy="315" rx="320" ry="260" fill="#F97316" opacity="0.06"/>
  <ellipse cx="950" cy="315" rx="260" ry="200" fill="#3B82F6" opacity="0.05"/>

  <!-- 立方体 Logo (放大版，左侧) -->
  <!-- 顶面 -->
  <polygon points="220,140 100,212 220,284 340,212" fill="#FB923C"/>
  <!-- 左面 -->
  <polygon points="100,212 100,356 220,428 220,284" fill="#F97316"/>
  <!-- 右面 -->
  <polygon points="340,212 220,284 220,428 340,356" fill="#C2410C"/>
  <!-- 边缘线 -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.2">
    <line x1="220" y1="140" x2="100" y2="212"/>
    <line x1="220" y1="140" x2="340" y2="212"/>
    <line x1="100" y1="212" x2="220" y2="284"/>
    <line x1="340" y1="212" x2="220" y2="284"/>
    <line x1="100" y1="212" x2="100" y2="356"/>
    <line x1="340" y1="212" x2="340" y2="356"/>
    <line x1="220" y1="284" x2="220" y2="428"/>
    <line x1="100" y1="356" x2="220" y2="428"/>
    <line x1="340" y1="356" x2="220" y2="428"/>
  </g>

  <!-- 分隔线 -->
  <line x1="420" y1="180" x2="420" y2="450" stroke="#374151" stroke-width="1.5"/>

  <!-- 右侧文字区域 -->
  <!-- DemoChain 标题 -->
  <text x="490" y="270" font-family="Inter, -apple-system, sans-serif" font-size="88" font-weight="700" fill="#F97316" letter-spacing="-2">DemoChain</text>

  <!-- 副标题 -->
  <text x="494" y="340" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#9CA3AF" letter-spacing="1">区块链共识机制可视化演示平台</text>

  <!-- 标签 -->
  <rect x="494" y="380" width="90" height="36" rx="8" fill="#1F2937"/>
  <text x="539" y="403" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#FB923C" text-anchor="middle">PoW</text>

  <rect x="596" y="380" width="90" height="36" rx="8" fill="#1F2937"/>
  <text x="641" y="403" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#60A5FA" text-anchor="middle">PoS</text>

  <rect x="698" y="380" width="100" height="36" rx="8" fill="#1F2937"/>
  <text x="748" y="403" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#A3E635" text-anchor="middle">DPoS</text>

  <rect x="810" y="380" width="90" height="36" rx="8" fill="#1F2937"/>
  <text x="855" y="403" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#F472B6" text-anchor="middle">BFT</text>

  <rect x="912" y="380" width="120" height="36" rx="8" fill="#1F2937"/>
  <text x="972" y="403" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#34D399" text-anchor="middle">Avalanche</text>

  <!-- 底部域名 -->
  <text x="494" y="490" font-family="Inter, monospace, sans-serif" font-size="24" fill="#4B5563" letter-spacing="1">demochain.org</text>
</svg>
